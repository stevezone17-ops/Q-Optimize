version: '3.9'

services:
  mongodb:
    image: mongo:7.0
    container_name: q-optimize-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: q_optimize
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: q-optimize-backend
    restart: unless-stopped
    environment:
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/q_optimize}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - APP_ENV=${APP_ENV:-production}
      - DEBUG=${DEBUG:-false}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:80}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: q-optimize-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongodb_data:
    driver: local
